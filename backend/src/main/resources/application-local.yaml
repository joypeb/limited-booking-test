server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/reservation_local
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms
reservation:
  rate-limit:
    limit: 20
    window: 60000ms
  security:
    admin-password: ${ADMIN_PASSWORD}
    user-a-password: ${USER_A_PASSWORD}
    user-b-password: ${USER_B_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
