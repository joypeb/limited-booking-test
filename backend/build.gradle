plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.limited-booking'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'
    failOnNoDiscoveredTests = true
    filter { failOnNoMatchingTests = true }
    reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${name}")
    reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${name}")
}

tasks.named('test', Test) {
    include '**/*Test.class'
    useJUnitPlatform { excludeTags 'contract', 'property' }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    include '**/*IT.class'
    useJUnitPlatform { excludeTags 'contract', 'property' }
    shouldRunAfter tasks.test
}

tasks.register('contractTest', Test) {
    group = 'verification'
    include '**/*IT.class'
    useJUnitPlatform { includeTags 'contract' }
    shouldRunAfter tasks.integrationTest
}

tasks.register('propertyTest', Test) {
    group = 'verification'
    include '**/*Test.class'
    useJUnitPlatform { includeTags 'property' }
    if (System.getenv('QT_SEED')) systemProperty 'QT_SEED', System.getenv('QT_SEED')
    shouldRunAfter tasks.contractTest, tasks.integrationTest
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'
}
