plugins {
    id 'java'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.limited-booking'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.quicktheories:quicktheories:0.26'
    testImplementation('com.atlassian.oai:openapi-request-validator-core:3.0.0') {
        // 고정 OpenAPI 3.0.3을 OpenAPIV3Parser로 읽으므로 Swagger 2 변환기는 사용하지 않는다.
        // 이 레거시 경로가 json-patch/jackson-coreutils를 다시 유입시킨다.
        exclude group: 'io.swagger.parser.v3', module: 'swagger-parser-v2-converter'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 계약 검증기의 전이 의존성 보안 예외를 테스트 classpath에만 적용한다.
// Jackson 3 애플리케이션 런타임은 기존 Spring Boot BOM 관리를 유지한다.
dependencyManagement {
    configurations('testCompileClasspath', 'testRuntimeClasspath') {
        imports {
            mavenBom 'com.fasterxml.jackson:jackson-bom:2.21.8'
        }
    }
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'
    failOnNoDiscoveredTests = true
    filter { failOnNoMatchingTests = true }
    reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${name}")
    reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${name}")
}

tasks.named('test', Test) {
    include '**/*Test.class'
    useJUnitPlatform { excludeTags 'contract', 'property' }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    include '**/*IT.class'
    useJUnitPlatform { excludeTags 'contract', 'property' }
    shouldRunAfter tasks.test
}

tasks.register('contractTest', Test) {
    group = 'verification'
    include '**/*IT.class'
    useJUnitPlatform { includeTags 'contract' }
    shouldRunAfter tasks.integrationTest
}

// 취약 모듈의 재유입을 실제 해석된 그래프에서 차단한다.
tasks.register('verifyContractDependencies') {
    group = 'verification'
    doLast {
        def forbidden = ['json-patch', 'jackson-coreutils']
        ['testCompileClasspath', 'testRuntimeClasspath', 'runtimeClasspath'].each { name ->
            def resolution = configurations.getByName(name).incoming.resolutionResult
            def unresolved = resolution.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }
            if (!unresolved.empty) {
                throw new GradleException("${name}: 의존성 해석 실패: ${unresolved*.attempted}")
            }
            def unsafe = resolution.allComponents.findAll {
                def module = it.moduleVersion
                module != null && module.group == 'com.github.java-json-tools' && module.name in forbidden
            }
            if (!unsafe.empty) {
                throw new GradleException("${name}: 취약 계약 검증 의존성 재유입: ${unsafe*.moduleVersion}")
            }
        }
    }
}
tasks.named('contractTest') { dependsOn tasks.named('verifyContractDependencies') }

tasks.register('propertyTest', Test) {
    group = 'verification'
    include '**/*Test.class'
    include '**/*IT.class'
    useJUnitPlatform { includeTags 'property' }
    if (System.getenv('QT_SEED')) systemProperty 'QT_SEED', System.getenv('QT_SEED')
    shouldRunAfter tasks.contractTest, tasks.integrationTest
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'
}

// 현재 실행 listener와 XML을 함께 검사한다. 캐시 결과를 새 실행으로 인정하지 않는다.
['test', 'integrationTest', 'contractTest', 'propertyTest'].each { testName ->
    def current = [started: false, result: null]
    def testTask = tasks.named(testName, Test)
    def gate = tasks.register("${testName}Result") {
        group = 'verification'
        doLast {
            def r = current.result
            if (!current.started || r == null) {
                throw new GradleException("${testName}: 현재 실행 결과 없음 (NO-SOURCE/이전 보고서로 통과 불가)")
            }
            logger.lifecycle("${testName}: tests=${r.tests}, failed=${r.failed}, skipped=${r.skipped}")
            if (r.tests < 1 || r.failed != 0 || r.skipped != 0) {
                throw new GradleException("${testName}: 실행>=1, 실패0, skip0 계약 위반")
            }
            def xmlFiles = fileTree(testTask.get().reports.junitXml.outputLocation).matching { include 'TEST-*.xml' }.files
            if (xmlFiles.empty) throw new GradleException("${testName}: XML 보고서 없음")
            long xmlCount = 0
            xmlFiles.each { f ->
                def root = new groovy.xml.XmlSlurper().parse(f)
                xmlCount += root.@tests.toLong()
                if (root.@failures.toLong() != 0 || root.@errors.toLong() != 0 || root.@skipped.toLong() != 0) {
                    throw new GradleException("${testName}: XML 실패/skip 결과")
                }
            }
            if (xmlCount != r.tests) throw new GradleException("${testName}: listener/XML 실행 수 불일치")
        }
    }
    testTask.configure {
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst { current.started = true; current.result = null }
        afterSuite { descriptor, result ->
            if (descriptor.parent == null) {
                current.result = [tests: result.testCount, failed: result.failedTestCount, skipped: result.skippedTestCount]
            }
        }
        finalizedBy gate
    }
}

tasks.register('verify') {
    group = 'verification'
    dependsOn tasks.test, tasks.integrationTest
}

pitest {
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'com.limitedbooking.backend.resource.ResourceRules',
        'com.limitedbooking.backend.reservation.IdempotencyKey',
        'com.limitedbooking.backend.reservation.CancellationDecision'
    ]
    targetTests = [
        'com.limitedbooking.backend.resource.ResourceRulesTest',
        'com.limitedbooking.backend.reservation.IdempotencyKeyTest',
        'com.limitedbooking.backend.reservation.CancellationDecisionTest'
    ]
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    threads = 1
    mutators = ['STRONGER']
    // RecordFilter가 레코드 canonical 생성자(IdempotencyKey 키 검증)를 걸러 내므로 그 필터만 끈다.
    // 컴파일러 생성 record 메서드는 업무 규칙 밖이라 변이 대상에서 제외한다.
    features = ['-FRECORD']
    excludedMethods = ['toString', 'hashCode', 'equals']
}

tasks.named('processTestResources') {
    from('../specs/002-setup-test-toolchain/contracts/toolchain-smoke.openapi.yaml')
    from('../docs/openapi.yaml') { rename { 'business.openapi.yaml' } }
}

tasks.named('pitest') {
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    doFirst { delete layout.buildDirectory.dir('reports/pitest') }
}
tasks.register('mutationSmoke') {
    group = 'verification'
    dependsOn tasks.pitest
    doLast {
        def xml = layout.buildDirectory.file('reports/pitest/mutations.xml').get().asFile
        def html = layout.buildDirectory.file('reports/pitest/index.html').get().asFile
        if (!xml.isFile() || !html.isFile()) throw new GradleException('PIT XML/HTML 보고서 없음')
        def mutations = new groovy.xml.XmlSlurper().parse(xml).mutation
        int generated = mutations.size()
        int killed = mutations.findAll { it.@status.text() == 'KILLED' }.size()
        def invalid = mutations.findAll { !(it.@status.text() in ['KILLED', 'SURVIVED']) }
        int survived = mutations.findAll { it.@status.text() == 'SURVIVED' }.size()
        double ratio = generated == 0 ? 0.0d : (double) killed / generated
        logger.lifecycle(String.format(Locale.ROOT, 'PIT generated=%d, killed=%d, survived=%d, invalid=%d, ratio=%.2f',
                generated, killed, survived, invalid.size(), ratio))
        mutations.findAll { it.@status.text() == 'SURVIVED' }.each { m ->
            logger.lifecycle("SURVIVED ${m.mutatedClass.text()}:${m.lineNumber.text()} ${m.mutator.text()} ${m.description.text()}")
        }
        invalid.each { m ->
            logger.lifecycle("INVALID ${m.@status.text()} ${m.mutatedClass.text()}:${m.lineNumber.text()} ${m.mutator.text()} ${m.description.text()}")
        }
        def allowedClasses = [
            'com.limitedbooking.backend.resource.ResourceRules',
            'com.limitedbooking.backend.reservation.IdempotencyKey',
            'com.limitedbooking.backend.reservation.CancellationDecision'
        ] as Set
        def outside = mutations.collect { it.mutatedClass.text() }.findAll { !(it in allowedClasses) } as Set
        if (!outside.isEmpty()) throw new GradleException("PIT 대상 밖 변이 클래스: ${outside}")
        if (generated < 1 || killed < 1 || !invalid.isEmpty()) {
            throw new GradleException('PIT 생성/탐지0 또는 NO_COVERAGE/도구 오류')
        }
        def minimumKillRatio = 0.80
        if (ratio < minimumKillRatio) {
            throw new GradleException(String.format(Locale.ROOT, 'PIT 탐지율 %.2f < %.2f', ratio, minimumKillRatio))
        }
    }
}

tasks.register('verifyContract') {
    group = 'verification'
    dependsOn tasks.verify, tasks.contractTest
}
tasks.register('verifyProperty') {
    group = 'verification'
    dependsOn tasks.verify, tasks.propertyTest
}
tasks.register('deepTest') {
    group = 'verification'
    dependsOn tasks.verify, tasks.contractTest, tasks.propertyTest
}
