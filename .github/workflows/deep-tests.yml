# 목적: Property 테스트와 PIT 변이 스모크(propertyTest mutationSmoke)를 수동으로 실행한다.
# 트리거: workflow_dispatch만. 기본 브랜치에 파일이 있어야 수동 실행할 수 있다.
# 한계: 단독 실행은 Unit/IT/Contract 회귀를 포함하지 않는다(verify.yml 담당).
# 경로 대응: 계획서의 Maven target/pit-reports·failsafe reports는
#   Gradle의 backend/build/reports/pitest·backend/build/test-results/propertyTest에 대응한다.
# 근거: 계획서 12단계, specs/013-ci-readme-final/plan.md D2·contracts C1 W7.
name: deep-tests

on:
  workflow_dispatch:
    inputs:
      qt_seed:
        description: 'Property 테스트 seed(정수만). 빈 값이면 테스트 기본 seed를 사용한다.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deep-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 25 설정
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle 설정(캐시)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: propertyTest·mutationSmoke 실행
        working-directory: backend
        env:
          INPUT_QT_SEED: ${{ inputs.qt_seed }}
        run: |
          # 입력은 env로만 받아 셸에 보간하지 않는다. 비어 있지 않을 때만 정수 검사 후 QT_SEED로 전달한다.
          if [ -n "$INPUT_QT_SEED" ]; then
            if ! [[ "$INPUT_QT_SEED" =~ ^[0-9]+$ ]]; then
              echo "qt_seed는 정수만 허용합니다" >&2
              exit 1
            fi
            export QT_SEED="$INPUT_QT_SEED"
          fi
          ./gradlew --no-daemon propertyTest mutationSmoke

      - name: Property 재현 정보 요약
        if: always()
        run: |
          .github/scripts/property-summary.sh backend/build/test-results/propertyTest > property-summary.txt
          (
            echo '### Property 재현 정보'
            echo '```'
            cat property-summary.txt
            echo '```'
          ) >> "$GITHUB_STEP_SUMMARY"

      - name: Property 보고서 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-property-reports
          path: |
            backend/build/test-results/propertyTest/**
            backend/build/reports/tests/propertyTest/**
            property-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: PIT 보고서 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-pit-reports
          path: backend/build/reports/pitest/**
          if-no-files-found: warn
          retention-days: 14
