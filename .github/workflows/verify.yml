# 목적: PR·develop/main push마다 Unit + 일반 IT + Contract 검증을 실행한다.
# 트리거: pull_request, push (develop, main). 정기 실행·수동 실행은 두지 않는다.
# 근거: 계획서 12단계, specs/013-ci-readme-final/plan.md D1·contracts C1.
name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 25 설정
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle 설정(캐시)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: verifyContract 실행
        working-directory: backend
        run: ./gradlew --no-daemon verifyContract

      - name: 테스트 보고서 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-test-reports
          path: |
            backend/build/test-results/**
            backend/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
